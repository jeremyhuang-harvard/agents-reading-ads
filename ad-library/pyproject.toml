[project]
name = "betting-ads-research"
version = "0.1.0"
description = "Data collection and measurement tools for betting-ad research"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.4.0",
  "openai-gabriel>=1.1.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "wheel>=0.48.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
